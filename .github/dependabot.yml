# Dependabot — 의존성 / GitHub Actions 버전을 주기적으로 점검해 PR 생성.
# 보안 패치 누락 (Spring Boot CVE, transitive 취약 라이브러리) 을 사람이 챙기지 않아도
# 매주 자동으로 올라온다.
version: 2
updates:
  # Gradle 멀티모듈 — 루트 build.gradle.kts 의 BOM / 플러그인 + 각 모듈 의존성.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Spring 생태계는 BOM 으로 버전이 묶여 움직이므로 한 PR 로 모은다.
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring.*"
      # 그 외 patch / minor 도 묶어 PR 수를 줄인다.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions — ci.yml / codeql.yml 의 action 버전 (actions/checkout 등).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
