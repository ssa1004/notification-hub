name: Notification Hub CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# 워크플로 기본은 최소 권한 (read-only). 권한이 더 필요한 job 만 개별로 올린다.
permissions:
  contents: read

# 같은 ref 의 이전 실행은 취소 — PR push 연타 시 러너 낭비 방지.
# 단, 태그/메인 push 는 릴리스 산출물이 걸리므로 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Unit + slice tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Compile
        run: ./gradlew --no-daemon compileKotlin compileTestKotlin compileTestJava

      - name: Run unit tests (domain + application + adapters)
        run: ./gradlew --no-daemon :notification-domain:test :notification-application:test :notification-adapter-out:test :notification-adapter-in:test

      - name: Bootstrap context test
        run: ./gradlew --no-daemon :notification-bootstrap:test

      # 위 단위 테스트 결과를 모듈 합산 커버리지(Kover)로 변환. test 산출물을 재사용하므로
      # 추가로 테스트를 다시 돌리지 않는다 (koverXmlReport 는 합산 + 리포트 생성만 담당).
      - name: Aggregate coverage (Kover)
        if: always()
        run: ./gradlew --no-daemon koverXmlReport koverHtmlReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            build/reports/kover/report.xml
            build/reports/kover/html/**

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: build/reports/kover/report.xml
          # 토큰 없이도 public repo 의 push/PR 에서 동작. 토큰이 있으면 secrets 로 주입.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  helm-validate:
    name: Helm lint + manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHART: helm/notification-hub
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.7.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      # helm lint — dev / prod 두 values 셋 모두. 차트 구조 / 필수 값 누락을 잡는다.
      - name: helm lint (dev + prod)
        run: |
          helm lint "$CHART" -f "$CHART/values.yaml"
          helm lint "$CHART" -f "$CHART/values-prod.yaml"

      # helm template | kubeconform — 렌더된 매니페스트를 K8s 스키마로 strict 검증.
      # 누락된 CRD 스키마(ServiceMonitor 등)는 무시하되, core API 오류는 실패시킨다.
      - name: helm template | kubeconform (dev + prod)
        run: |
          set -euo pipefail
          for VALUES in values.yaml values-prod.yaml; do
            echo "::group::kubeconform $VALUES"
            helm template ci "$CHART" -f "$CHART/$VALUES" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default
            echo "::endgroup::"
          done

  integration-test:
    name: Testcontainers IT
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run e2e Testcontainers
        run: ./gradlew --no-daemon :e2e-tests:test

      - name: Upload e2e reports (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports
          path: |
            e2e-tests/build/reports/tests/**
            e2e-tests/build/test-results/**

  build-image:
    name: Build & push container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, helm-validate, integration-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="main-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: infrastructure/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notification-hub:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # Trivy 이미지 스캔 — SARIF 로 출력해 GitHub Security 탭에 업로드.
      # continue-on-error: 스캔 자체가 게이트가 아니라 가시성 목적 (취약점은 Security 탭에서 추적).
      - name: Trivy image scan (SARIF)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/notification-hub:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # 공급망 서명/증명 — keyless cosign (OIDC id-token) + SBOM(SPDX) attestation.
      # job 전체가 if: github.event_name == 'push' 가드를 받으므로 fork PR 에서는 실행되지 않는다.
      # 푸시된 이미지 digest 를 build-push-action 출력에서 받아 태그가 아닌 digest 로 서명한다.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/notification-hub
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/notification-hub@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM as provenance (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/notification-hub
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}@${DIGEST}"
