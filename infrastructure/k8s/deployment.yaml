apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-hub
  namespace: notification
  labels:
    app.kubernetes.io/name: notification-hub
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # PDB 와 함께 zero-downtime
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-hub
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: notification-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-hub
          image: ghcr.io/your-org/notification-hub:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: notification-hub-config, key: DB_HOST } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: notification-hub-config, key: DB_NAME } }
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: notification-hub-config, key: REDIS_HOST } }
            - name: KAFKA_BOOTSTRAP
              valueFrom: { configMapKeyRef: { name: notification-hub-config, key: KAFKA_BOOTSTRAP } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: notification-hub-secret, key: db.user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: notification-hub-secret, key: db.password } }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "300m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "1.5Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # 3종 probe 분리 (startup/readiness/liveness) — Spring Boot Actuator 의 health
          # group 매핑은 application.yml 의 `management.endpoint.health.group` 참고.
          # startupProbe 는 부팅 단계 (Flyway 마이그레이션 + JPA 초기화 + Kafka producer/Redis
          # 첫 connection) 가 끝날 때까지 readiness/liveness 를 막고, 그 동안 K8s 가 죽이지 않게.
          # 부팅 후엔 readiness/liveness 가 책임을 인계받음.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 40   # 5s + 3s × 40 = 약 2분 — Flyway / 캐시 워밍업 충분
          # readiness 는 외부 의존 (Kafka producer / Redis) 의 실시간 상태 — 의존 단절이면
          # service endpoint 에서 빠짐. 5s 주기로 빠르게 반영.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # liveness 는 process alive 만. 외부 의존과 무관 — Kafka 일시 단절로 pod 재기동되면
          # cascade 장애가 됨.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          lifecycle:
            preStop:
              # 5s sleep — service endpoint 에서 pod 가 빠지는 시간 확보 (kube-proxy
              # iptables update + LB endpoint sync 가 SIGTERM 보다 늦게 도착하는 race 회피).
              # 그 후 SIGTERM → Spring graceful shutdown (server.shutdown=graceful, 25s phase).
              exec:
                command: ["sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir: {}
      # terminationGrace = preStop 5s + Spring graceful 25s — 합 30s 안에 in-flight 정리.
      terminationGracePeriodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-hub
  namespace: notification
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-hub
