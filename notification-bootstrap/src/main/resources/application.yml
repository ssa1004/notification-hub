spring:
  application:
    name: notification-hub
  threads:
    virtual:
      enabled: true   # Java 21 virtual threads — vendor 호출 다수 동시 처리에 적합
  lifecycle:
    # graceful shutdown 의 phase 별 timeout. web container, scheduled task, kafka consumer 등이
    # 이 시간 안에 정리 안 되면 강제 종료. 짧으면 in-flight 잘림, 길면 K8s 가 SIGKILL.
    timeout-per-shutdown-phase: 25s
  datasource:
    url: jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # 산정 근거: 채널 4종 worker (PUSH/EMAIL/SMS/KAKAO) × 평균 동시 처리 4 + Outbox relay 2
      # + REST 동시 요청 여유분 ~ 20. virtual thread 라도 JDBC 는 OS thread 점유.
      maximum-pool-size: 20
      # 평시 idle 5개 유지 — 갑작스런 트래픽에 신규 connection 생성 latency 회피
      minimum-idle: 5
      # vendor → DB 응답 < 100ms 가정. 3s 안에 connection 못 받으면 fail-fast → 호출 측에 빨리 알림
      connection-timeout: 3000
      # connection 유효 수명 — DB 측 wait_timeout / firewall idle close 보다 짧게 설정
      # PostgreSQL 기본 idle_in_transaction_session_timeout 30분 < 우리 29분 < OK
      max-lifetime: 1740000
      # idle connection 수명 — minimum-idle 보다 큰 connection 만 회수
      idle-timeout: 600000
      # connection leak (close 누락) 30s 넘으면 stack trace 로그. 운영 누수 추적용
      leak-detection-threshold: 30000
      pool-name: notification-hub-pool
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-hub
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080
  # SIGTERM 받으면 pending request 처리하고 종료. K8s preStop sleep 5s + grace 25s 와 합쳐
  # 30s 안에 in-flight 요청 정리 + connection drain.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # K8s 3종 probe 매핑 — readiness 는 외부 의존 (Kafka/Redis) 도 체크,
        # liveness 는 process alive 만. ApplicationReadinessCoordinator 가 readinessState 를
        # 직접 갱신하므로 별도 indicator 추가 안 함 (중복 fail 방지).
        readiness:
          include: readinessState
        liveness:
          include: livenessState
  health:
    kafka:
      enabled: false   # 기본 KafkaHealthIndicator 끄고 ApplicationReadinessCoordinator 사용
    redis:
      enabled: false   # 위와 동일

readiness:
  probe-interval-ms: 5000

# 운영 endpoint (/api/v1/admin/**) 보호용 token. 미설정이면 모든 admin 요청 거절 (default-deny).
# 운영 환경은 ENV 로 주입 (Secret 권장).
admin:
  auth:
    token: ${ADMIN_AUTH_TOKEN:}

springdoc:
  swagger-ui:
    path: /swagger

# Outbox relay polling
outbox:
  relay:
    fixed-delay-ms: 500
    batch-size: 50
    send-timeout-ms: 3000

# 사용자 × channel 별 토큰 버킷 — vendor 비용 / 사용자 폭주 방지
ratelimit:
  window-ms: 60000
  push-per-window: 30
  email-per-window: 30
  sms-per-window: 5
  kakao-per-window: 5

# vendor mock — failure-rate 0.0~1.0 사이 (테스트용 인위 실패 주입)
# kakao.enforce-night-block — KST 21:00~08:00 시 vendor 측에서 영구 실패 반환할지 (실서비스
# 카카오 알림톡 정책 반영). ChannelResolver 단에서도 1차 차단되지만, 우회 발송 / 운영자 강제
# replay 시 vendor 단 final 거절 시뮬레이션.
vendor:
  fcm:
    failure-rate: 0.0
  ses:
    failure-rate: 0.0
  twilio:
    failure-rate: 0.0
  kakao:
    failure-rate: 0.0
    enforce-night-block: false

# Resilience4j retry config — vendor 호출 단계.
# *경계*: 여기 retry 는 한 vendor 호출 *내부* 의 단발성 5xx/IO 흡수만 책임 (max 3회 = 3 * 200~600ms).
# 그 retry 가 모두 실패하면 throw → DispatchDeliveryService 가 markFailed → 도메인 측에서
# DeliveryAttempt.retryCount++ 해서 PENDING 으로 환원 → outbox 다음 polling 에서 재발송.
# 즉 "vendor 호출 1회의 즉시 재시도" 와 "attempt 단위 재시도" 가 *직렬* 로 동작 — 같은 호출에
# 대해 중복으로 polling + retry 가 돌지 않음.
#
# 키 (fcm/ses/twilio/kakao) 는 vendor 별 SLA 가 다른 경우 wait-duration / multiplier 만 별도
# 조정할 수 있게 분리. 현재는 동일 값.
resilience4j:
  retry:
    instances:
      fcm: &vendor-retry
        max-attempts: 3
        wait-duration: 200ms
        # exponential backoff: 200ms → 400ms → 800ms (factor 2.0)
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        # ±50% jitter — 다중 pod 가 동시에 vendor 측 hot spot 으로 몰리는 stampede 방지
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # whitelist — 5xx/network 만 retry. 4xx (VendorPermanentException) 는 즉시 fail.
        # IOException 은 dispatch 시그니처상 unchecked 로 감싸 던짐 (UncheckedIOException).
        retry-exceptions:
          - com.example.notification.adapter.out.vendor.VendorTransientException
          - java.io.UncheckedIOException
          - java.io.IOException
        ignore-exceptions:
          - com.example.notification.adapter.out.vendor.VendorPermanentException
      ses: *vendor-retry
      twilio: *vendor-retry
      kakao: *vendor-retry

logging:
  level:
    com.example.notification: INFO
    audit: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
    driver-class-name: org.postgresql.Driver
    hikari:
      # prod 는 동일 베이스에 실 운영용 환경 변수 override 위주 — 풀 크기는 외부 ENV 로 노출
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 3000
      max-lifetime: 1740000
      idle-timeout: 600000
      leak-detection-threshold: 30000
      pool-name: notification-hub-pool

webhook:
  # vendor 별 HMAC-SHA256 서명 secret. 운영에서는 KMS / Vault 로 주입 권장 (env 평문은 임시).
  # 누군가 콜백 URL 만 알아도 가짜 "전송 성공" 마킹을 못 하게 하는 핵심 안전장치.
  secrets:
    fcm: ${WEBHOOK_SECRET_FCM:}
    ses: ${WEBHOOK_SECRET_SES:}
    twilio: ${WEBHOOK_SECRET_TWILIO:}
    kakao: ${WEBHOOK_SECRET_KAKAO:}

---
# test 프로파일 — Testcontainers / 단위 통합용. leak detection 끔 (테스트는 종료 시점에
# Spring context tear-down 이 connection close 보다 늦으면 false positive 가 시끄러움).
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      max-lifetime: 1740000
      idle-timeout: 600000
      leak-detection-threshold: 0
      pool-name: notification-hub-pool-test
