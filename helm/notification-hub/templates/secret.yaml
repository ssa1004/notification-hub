{{- /*
secrets.mode = create — 차트가 평문값을 base64 인코딩해서 Secret 생성. dev / 로컬용.
secrets.mode = external — 차트는 Secret 을 만들지 않음. existingSecretName 을 그대로 참조.
                          (KMS / Vault / ExternalSecrets operator 가 미리 동기화 가정)
prod 권장은 external. 본 chart 의 placeholder 키 이름과 외부 Secret 의 키 이름이 같아야 함.
*/ -}}
{{- if eq .Values.secrets.mode "create" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notification-hub.fullname" . }}
  labels:
    {{- include "notification-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ---- DB ----
  DB_USER: {{ .Values.secrets.db.user | quote }}
  DB_PASSWORD: {{ .Values.secrets.db.password | quote }}
  # ---- 운영자 토큰 ----
  ADMIN_AUTH_TOKEN: {{ .Values.secrets.admin.authToken | quote }}
  # ---- vendor webhook HMAC secret ----
  WEBHOOK_SECRET_FCM: {{ .Values.secrets.webhook.fcm | quote }}
  WEBHOOK_SECRET_SES: {{ .Values.secrets.webhook.ses | quote }}
  WEBHOOK_SECRET_TWILIO: {{ .Values.secrets.webhook.twilio | quote }}
  WEBHOOK_SECRET_KAKAO: {{ .Values.secrets.webhook.kakao | quote }}
  # ---- vendor 자체 인증 (real 모드에서 사용) ----
  FCM_SERVICE_ACCOUNT_JSON: {{ .Values.secrets.vendor.fcmServiceAccountJson | quote }}
  SES_ACCESS_KEY_ID: {{ .Values.secrets.vendor.sesAccessKeyId | quote }}
  SES_SECRET_ACCESS_KEY: {{ .Values.secrets.vendor.sesSecretAccessKey | quote }}
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.vendor.twilioAccountSid | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.vendor.twilioAuthToken | quote }}
  KAKAO_API_KEY: {{ .Values.secrets.vendor.kakaoApiKey | quote }}
{{- end }}
