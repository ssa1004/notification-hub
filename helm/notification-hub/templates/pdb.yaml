{{- if .Values.pdb.enabled -}}
{{- /* replicaCount 1 + HPA off 면 PDB 가 모든 voluntary disruption 차단 — 의미 없으므로 skip */ -}}
{{- if or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "notification-hub.fullname" . }}
  labels:
    {{- include "notification-hub.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "notification-hub.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
