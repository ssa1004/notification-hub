apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-hub.fullname" . }}
  labels:
    {{- include "notification-hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "notification-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notification-hub.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # configmap 변경 시 pod rollout 트리거 — sha 가 바뀌면 새 ReplicaSet
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if eq .Values.secrets.mode "create" }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "notification-hub.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ include "notification-hub.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfile | quote }}
            # ---- ConfigMap (호스트 / 풀 크기 / vendor mock 토글) ----
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: DB_NAME
            - name: DB_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: DB_POOL_MAX
            - name: DB_POOL_MIN_IDLE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: DB_POOL_MIN_IDLE
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: REDIS_PORT
            - name: KAFKA_BOOTSTRAP
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: KAFKA_BOOTSTRAP
            - name: VENDOR_MODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "notification-hub.fullname" . }}-config
                  key: VENDOR_MODE
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Secret 통째로 envFrom — DB_USER / DB_PASSWORD / ADMIN_AUTH_TOKEN /
          # WEBHOOK_SECRET_* / vendor 자격 증명. 외부 Secret 모드든 자체 생성 모드든 키 이름은 동일.
          envFrom:
            - secretRef:
                name: {{ include "notification-hub.secretName" . }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.httpGet.path }}
              port: {{ .Values.probes.startup.httpGet.port }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.httpGet.path }}
              port: {{ .Values.probes.readiness.httpGet.port }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.httpGet.path }}
              port: {{ .Values.probes.liveness.httpGet.port }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          lifecycle:
            preStop:
              # Service endpoint 가 pod 를 빼내는 시간 확보 — kube-proxy iptables sync race 회피.
              # SIGTERM 직전 N초 sleep → Spring graceful shutdown phase (server.shutdown=graceful) 인계.
              exec:
                command: ["sh", "-c", "sleep {{ .Values.gracefulShutdown.preStopSleepSeconds }}"]
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
