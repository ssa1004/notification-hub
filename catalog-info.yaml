---
# Backstage Software Catalog 정의 — notification-hub component + REST + AsyncAPI.
# system 정의는 ssa1004/auth-service 레포에 있다.

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notification-hub
  description: "다채널 알림 백엔드 (PUSH / EMAIL / SMS / KAKAO) — Outbox relay + SKIP LOCKED, Resilience4j retry+CB, HMAC webhook, multi-channel rate limit, Virtual Threads"
  annotations:
    github.com/project-slug: ssa1004/notification-hub
    backstage.io/source-location: url:https://github.com/ssa1004/notification-hub
  tags:
    - notification
    - multi-channel
    - outbox-pattern
    - resilience4j
    - virtual-threads
    - webhook
    - kafka
  links:
    - url: https://github.com/ssa1004/notification-hub
      title: GitHub Repository
    - url: https://github.com/ssa1004/notification-hub/blob/main/README.md
      title: README
    - url: https://github.com/ssa1004/notification-hub/tree/main/docs/adr
      title: ADRs
spec:
  type: service
  lifecycle: experimental
  owner: user:ssa1004
  system: ssa1004-portfolio
  providesApis:
    - notification-rest
    - notification-hub-alerts-fired
  consumesApis:
    - resell-orderbook-domain-events
    - billing-platform-domain-events
    - gpu-job-orchestrator-domain-events
  dependsOn:
    - component:auth-service

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: notification-rest
  description: "다채널 알림 발송 / 템플릿 / 수신자 그룹 / 발송 이력 조회 REST API"
  annotations:
    github.com/project-slug: ssa1004/notification-hub
spec:
  type: openapi
  lifecycle: experimental
  owner: user:ssa1004
  system: ssa1004-portfolio
  definition: |
    openapi: 3.0.3
    info:
      title: Notification Hub REST API
      version: 1.0.0
      description: |
        PUSH / EMAIL / SMS / KAKAO 4채널 통합 알림 발송 API.
        Outbox 패턴 + SKIP LOCKED 로 at-least-once 보장.
    paths:
      /api/v1/notifications:
        post:
          summary: 알림 발송 요청 (Outbox enqueue, 비동기)
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [channel, recipient, templateId]
                  properties:
                    channel: { type: string, enum: [PUSH, EMAIL, SMS, KAKAO] }
                    recipient: { type: string }
                    templateId: { type: string }
                    variables: { type: object, additionalProperties: true }
                    idempotencyKey: { type: string }
          responses:
            "202":
              description: 발송 요청 수락 (Outbox 등록)
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      notificationId: { type: string }
                      status: { type: string, enum: [QUEUED] }
      /api/v1/notifications/{id}:
        get:
          summary: 발송 결과 조회
          parameters:
            - in: path
              name: id
              required: true
              schema: { type: string }
          responses:
            "200": { description: 발송 결과 (QUEUED / SENT / FAILED / RETRYING) }
      /api/v1/templates:
        get:
          summary: 템플릿 목록
          responses:
            "200": { description: 템플릿 목록 }

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: notification-hub-alerts-fired
  description: "알림 발송 실패 / SLA 위반 / 임계치 초과 시 발행되는 alerts.fired 이벤트 (AsyncAPI)"
  annotations:
    github.com/project-slug: ssa1004/notification-hub
spec:
  type: asyncapi
  lifecycle: experimental
  owner: user:ssa1004
  system: ssa1004-portfolio
  definition: |
    asyncapi: 2.6.0
    info:
      title: Notification Hub Alerts Fired
      version: 1.0.0
      description: |
        알림 발송 실패 / SLA breach / DLQ 적재 시 발행되는 보안 / 운영 이벤트.
        security-log-search 가 이 topic 을 구독해 SIEM 으로 집계.
    channels:
      alerts.fired:
        description: 알림 발송 이상 이벤트
        subscribe:
          message:
            name: AlertsFired
            payload:
              type: object
              required: [eventId, occurredAt, severity, source, detail]
              properties:
                eventId: { type: string, format: uuid }
                occurredAt: { type: string, format: date-time }
                severity: { type: string, enum: [INFO, WARN, ERROR, CRITICAL] }
                source: { type: string, example: notification-hub }
                tenantId: { type: string }
                channel: { type: string, enum: [PUSH, EMAIL, SMS, KAKAO] }
                detail:
                  type: object
                  properties:
                    code: { type: string }
                    message: { type: string }
                    notificationId: { type: string }
